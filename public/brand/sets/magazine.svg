<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Magazine floor set">
  <defs>
    <linearGradient id="mag-cyc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#046BD2"/>
      <stop offset="45%" stop-color="#13016F"/>
      <stop offset="100%" stop-color="#090046"/>
